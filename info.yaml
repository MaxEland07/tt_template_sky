# Tiny Tapeout project information
project:
  title:        "Simple Adder Test"
  author:       "Max"
  discord:      ""
  description:  "Simple test for github actions"
  language:     "Verilog"
  clock_hz:     0

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "IN A[0]"
  ui[1]: "IN A[1]"
  ui[2]: "IN A[2]"
  ui[3]: "IN A[3]"
  ui[4]: "IN A[4]"
  ui[5]: "IN A[5]"
  ui[6]: "IN A[6]"
  ui[7]: "IN A[7]"

  # Outputs
  uo[0]: "SUM[0]"
  uo[1]: "SUM[1]"
  uo[2]: "SUM[2]"
  uo[3]: "SUM[3]"
  uo[4]: "SUM[4]"
  uo[5]: "SUM[5]"
  uo[6]: "SUM[6]"
  uo[7]: "SUM[7]"

  # Bidirectional pins
  uio[0]: "IN B[0]"
  uio[1]: "IN B[1]"
  uio[2]: "IN B[2]"
  uio[3]: "IN B[3]"
  uio[4]: "IN B[4]"
  uio[5]: "IN B[5]"
  uio[6]: "IN B[6]"
  uio[7]: "IN B[7]"

# Do not change!
yaml_version: 6